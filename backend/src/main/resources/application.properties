spring.application.name=musify
server.port=8088

# Database Configuration (Supabase PostgreSQL with in-memory fallback for local dev)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:musifydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (for debugging in dev mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
musify.jwt.secret=${JWT_SECRET:musifySecretKeyMustBeVeryLongForHS512ToWorkProperlyInProductionSecurityEnvironment2026!}
musify.jwt.expiration-ms=604800000

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
